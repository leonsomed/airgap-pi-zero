<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compact SeedQR Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background:
        radial-gradient(ellipse at 20% 0%, #1a3a42 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, #0d2a30 0%, transparent 45%),
        #00151a;
      min-height: 100vh;
    }
  </style>
</head>
<body class="text-slate-100 antialiased">
  <main class="mx-auto max-w-lg px-4 py-10">
    <h1 class="font-serif text-3xl tracking-tight text-[#f99925]">SeedQR</h1>
    <p class="mt-2 text-sm text-slate-400">
      Enter a 12- or 24-word BIP39 mnemonic. Reveal Compact SeedQR and fingerprints.
    </p>

    <label class="mt-8 block text-sm font-medium text-slate-300" for="mnemonic">
      Seed phrase
    </label>
    <textarea
      id="mnemonic"
      rows="4"
      spellcheck="false"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      placeholder="twelve or twenty four words …"
      class="mt-1 w-full rounded-md border border-slate-600 bg-[#002a32] px-3 py-2 font-mono text-sm text-slate-100 placeholder:text-slate-600 focus:border-[#f99925] focus:outline-none focus:ring-1 focus:ring-[#f99925]"
    ></textarea>
    <p id="mnemonicError" class="mt-1 hidden text-sm text-red-400"></p>
    <p id="libStatus" class="mt-1 text-xs text-slate-500">Loading crypto libraries…</p>

    <label class="mt-5 block text-sm font-medium text-slate-300" for="passphrase">
      BIP39 passphrase <span class="font-normal text-slate-500">(optional)</span>
    </label>
    <textarea
      id="passphrase"
      rows="4"
      autocomplete="off"
      spellcheck="false"
      autocorrect="off"
      autocapitalize="off"
      class="mt-1 w-full rounded-md border border-slate-600 bg-[#002a32] px-3 py-2 font-mono text-sm text-slate-100 focus:border-[#f99925] focus:outline-none focus:ring-1 focus:ring-[#f99925]"
    ></textarea>

    <section class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div class="rounded-md border border-slate-700 bg-[#001f26] p-4">
        <h2 class="text-xs uppercase tracking-wide text-slate-500">Without passphrase</h2>
        <p class="mt-2 text-xs text-slate-400">BIP32 fingerprint</p>
        <p id="fpPlain" class="mt-1 font-mono text-lg text-[#f99925]">—</p>
        <button
          id="btnQrPlain"
          type="button"
          disabled
          class="mt-4 w-full rounded-md bg-[#f99925] px-3 py-2 text-sm font-medium text-[#00151a] disabled:cursor-not-allowed disabled:opacity-40"
        >
          Reveal SeedQR
        </button>
      </div>

      <div class="rounded-md border border-slate-700 bg-[#001f26] p-4">
        <h2 class="text-xs uppercase tracking-wide text-slate-500">With passphrase</h2>
        <p class="mt-2 text-xs text-slate-400">BIP32 fingerprint</p>
        <p id="fpPass" class="mt-1 font-mono text-lg text-[#f99925]">—</p>
        <button
          id="btnQrPass"
          type="button"
          disabled
          class="mt-4 w-full rounded-md border border-[#f99925] bg-transparent px-3 py-2 text-sm font-medium text-[#f99925] disabled:cursor-not-allowed disabled:opacity-40"
        >
          Reveal passphrase QR
        </button>
        <p class="mt-2 text-[11px] leading-snug text-slate-500">
          This QR encodes the passphrase as plain text.
        </p>
      </div>
    </section>
  </main>

  <!-- Modal -->
  <div
    id="modal"
    class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4"
    role="dialog"
    aria-modal="true"
  >
    <div class="relative w-full max-w-md rounded-lg border border-slate-600 bg-[#00151a] p-5 shadow-xl">
      <button
        id="modalClose"
        type="button"
        class="absolute right-3 top-2 text-2xl leading-none text-slate-400 hover:text-[#f99925]"
        aria-label="Close"
      >
        &times;
      </button>
      <h3 id="modalTitle" class="pr-8 text-sm font-medium text-slate-300"></h3>
      <p id="modalFp" class="mt-1 font-mono text-xs text-[#f99925]"></p>
      <div id="modalQr" class="mt-4 flex justify-center [&_canvas]:max-w-full"></div>
      <p id="modalNote" class="mt-3 text-center text-[11px] text-slate-500"></p>
    </div>
  </div>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const el = {
      mnemonic: $('mnemonic'),
      passphrase: $('passphrase'),
      error: $('mnemonicError'),
      libStatus: $('libStatus'),
      fpPlain: $('fpPlain'),
      fpPass: $('fpPass'),
      btnQrPlain: $('btnQrPlain'),
      btnQrPass: $('btnQrPass'),
      modal: $('modal'),
      modalClose: $('modalClose'),
      modalTitle: $('modalTitle'),
      modalFp: $('modalFp'),
      modalQr: $('modalQr'),
      modalNote: $('modalNote'),
    };

    function setLibError(msg) {
      el.libStatus.textContent = msg;
      el.libStatus.classList.remove('text-slate-500');
      el.libStatus.classList.add('text-red-400');
    }
    let bip39, wordlist, HDKey, QRCode;
    try {
      bip39 = await import('https://cdn.jsdelivr.net/npm/@scure/bip39@1.3.0/+esm');
      ({ wordlist } = await import(
        'https://cdn.jsdelivr.net/npm/@scure/bip39@1.3.0/wordlists/english.js/+esm'
      ));
      ({ HDKey } = await import('https://cdn.jsdelivr.net/npm/@scure/bip32@1.4.0/+esm'));
      QRCode = (await import('https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm')).default;
      el.libStatus.textContent = '';
    } catch (e) {
      console.error(e);
      setLibError(
        'Failed to load libraries. Serve this page over http:// (not file://) and check the network.'
      );
      throw e;
    }

    /** Compact SeedQR bytes (SeedSigner): 11-bit indices, checksum bits dropped */
    function phraseToCompactQrBytes(phrase) {
      const words = phrase.trim().split(/\s+/);
      const bits = words
        .map((w) => {
          const i = wordlist.indexOf(w);
          if (i < 0) throw new Error(`Unknown word: ${w}`);
          return i.toString(2).padStart(11, '0');
        })
        .join('');
      const byteCount = (words.length * 32) / 3 / 8; // 16 for 12w, 32 for 24w
      const bytes = (bits.match(/[01]{8}/g) || [])
        .map((b) => parseInt(b, 2))
        .slice(0, byteCount);
      return new Uint8Array(bytes);
    }

    /** @scure/bip32 fingerprint is a uint32 number, not a byte array */
    function fingerprintFromSeed(seed) {
      const fp = HDKey.fromMasterSeed(seed).fingerprint >>> 0;
      return fp.toString(16).padStart(8, '0');
    }

    function normalizeMnemonic(raw) {
      return raw.trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function validateMnemonic(phrase) {
      const words = phrase.split(' ');
      if (words.length !== 12 && words.length !== 24) {
        return 'Enter exactly 12 or 24 words.';
      }
      if (!bip39.validateMnemonic(phrase, wordlist)) {
        return 'Invalid BIP39 mnemonic (checksum or wordlist).';
      }
      return '';
    }

    let state = { valid: false, phrase: '', pass: '' };

    function refresh() {
      try {
        const phrase = normalizeMnemonic(el.mnemonic.value);
        const pass = el.passphrase.value;
        const err = phrase ? validateMnemonic(phrase) : '';

        el.error.textContent = err;
        el.error.classList.toggle('hidden', !err);

        if (!phrase || err) {
          state = { valid: false, phrase: '', pass: '' };
          el.fpPlain.textContent = '—';
          el.fpPass.textContent = '—';
          el.btnQrPlain.disabled = true;
          el.btnQrPass.disabled = true;
          return;
        }

        const seedPlain = bip39.mnemonicToSeedSync(phrase, '');
        const seedPass = bip39.mnemonicToSeedSync(phrase, pass);

        el.fpPlain.textContent = fingerprintFromSeed(seedPlain);
        el.fpPass.textContent = fingerprintFromSeed(seedPass);
        el.btnQrPlain.disabled = false;
        el.btnQrPass.disabled = false;
        state = { valid: true, phrase, pass };
      } catch (e) {
        console.error(e);
        el.error.textContent = e.message || String(e);
        el.error.classList.remove('hidden');
        el.btnQrPlain.disabled = true;
        el.btnQrPass.disabled = true;
      }
    }

    async function showModal({ title, fp, note, qrValue, binary }) {
      el.modalTitle.textContent = title;
      el.modalFp.textContent = fp ? `Fingerprint: ${fp}` : '';
      el.modalNote.textContent = note || '';
      el.modalQr.innerHTML = '';

      const canvas = document.createElement('canvas');
      if (binary) {
        const asLatin1 = String.fromCharCode(...qrValue);
        await QRCode.toCanvas(canvas, [{ data: asLatin1, mode: 'byte' }], {
          errorCorrectionLevel: 'L',
          margin: 2,
          width: 280,
          color: { dark: '#00151a', light: '#f99925' },
        });
      } else {
        await QRCode.toCanvas(canvas, qrValue, {
          errorCorrectionLevel: 'L',
          margin: 2,
          width: 280,
          color: { dark: '#00151a', light: '#f99925' },
        });
      }

      el.modalQr.appendChild(canvas);
      el.modal.classList.remove('hidden');
      el.modal.classList.add('flex');
    }

    function hideModal() {
      el.modal.classList.add('hidden');
      el.modal.classList.remove('flex');
      el.modalQr.innerHTML = '';
    }

    el.mnemonic.addEventListener('input', refresh);
    el.passphrase.addEventListener('input', refresh);

    el.btnQrPlain.addEventListener('click', async () => {
      if (!state.valid) return;
      try {
        const bytes = phraseToCompactQrBytes(state.phrase);
        await showModal({
          title: 'Compact SeedQR (mnemonic only)',
          fp: el.fpPlain.textContent,
          note: 'Does not include passphrase. Compatible with SeedSigner / Jade Compact SeedQR.',
          qrValue: bytes,
          binary: true,
        });
      } catch (e) {
        console.error(e);
        el.error.textContent = e.message || String(e);
        el.error.classList.remove('hidden');
      }
    });

    el.btnQrPass.addEventListener('click', async () => {
      if (!state.valid) return;
      try {
        await showModal({
          title: 'BIP39 passphrase',
          fp: '',
          note: 'Plain-text passphrase. Keep this QR private.',
          qrValue: el.passphrase.value,
          binary: false,
        });
      } catch (e) {
        console.error(e);
        el.error.textContent = e.message || String(e);
        el.error.classList.remove('hidden');
      }
    });

    el.modalClose.addEventListener('click', hideModal);
    el.modal.addEventListener('click', (e) => {
      if (e.target === el.modal) hideModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') hideModal();
    });

    refresh();
  </script>
</body>
</html>
